[project]
name = "onec-ops"
version = "0.11.0"
description = "CLI-утилита и Agent Skill для пакетных операций 1С:Предприятие"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Guesto", email = "guesto@guesto.ru" }]
keywords = ["1c", "onec", "cli", "automation", "agent-skill"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: Russian",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/guesto/onec-ops"
Changelog = "https://github.com/guesto/onec-ops/blob/main/CHANGELOG.md"
Issues = "https://github.com/guesto/onec-ops/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
    "ruff==0.16.10",
    "pre-commit>=3.0",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
onec-ops = "onec_ops.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["onec_ops"]

# Навык лежит в корне репозитория, в wheel он попадает внутрь пакета
# для команды install-skill.
[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "onec_ops/skill/SKILL.md"
"references" = "onec_ops/skill/references"
"agents" = "onec_ops/skill/agents"

[tool.hatch.build.targets.sdist]
include = [
    "onec_ops",
    "tests",
    "SKILL.md",
    "references",
    "agents",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=onec_ops --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
