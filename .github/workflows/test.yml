name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check onec_ops tests

      - name: Check formatting
        run: ruff format --check onec_ops tests

      - name: Run tests
        run: pytest -v --junitxml=report.xml

      - name: Report failed tests
        if: failure()
        run: python .github/scripts/report_failures.py report.xml

      - name: Check CLI starts
        run: onec-ops --help

  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Check wheel contents and install-skill
        shell: bash
        run: |
          python .github/scripts/check_wheel.py dist/*.whl
          python -m venv "$RUNNER_TEMP/wheel-venv"
          venv="$RUNNER_TEMP/wheel-venv"
          if [ -x "$venv/bin/python" ]; then bin="$venv/bin"; else bin="$venv/Scripts"; fi
          "$bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$bin/onec-ops" --version
          "$bin/onec-ops" install-skill --target "$RUNNER_TEMP/skill"
          "$bin/onec-ops" install-skill --target "$RUNNER_TEMP/skill" --check
          test -f "$RUNNER_TEMP/skill/references/commands.md"
